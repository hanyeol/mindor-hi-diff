[build-system]
requires = [ "setuptools>=61", "wheel" ]
build-backend = "setuptools.build_meta"

[project]
name = "mindor-hi-diff"
version = "0.1.0"
description = "Inference-only HI-Diff deblurring kernels extracted from zhengchen1999/HI-Diff."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [ { name = "Hanyeol Cho" } ]
keywords = [ "hi-diff", "deblurring", "image-restoration", "diffusion" ]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.0",
  "numpy",
  "einops>=0.6.1",
  "tqdm",
]

[project.urls]
Homepage = "https://github.com/hanyeol/mindor-hi-diff"
Repository = "https://github.com/hanyeol/mindor-hi-diff"
Upstream = "https://github.com/zhengchen1999/HI-Diff"

[tool.setuptools.packages.find]
where = [ "." ]
include = [ "mindor_hi_diff*" ]
